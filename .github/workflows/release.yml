name: Release

# The ONLY publish path. Releasing = `git tag vX.Y.Z && git push --tags`.
# Version comes from the tag via hatch-vcs; there is nothing to bump.
#
# OWNER SETUP (one-time, before first use): register this repo as a
# Trusted Publisher on PyPI (project gds_fdtd, workflow release.yml,
# environment pypi) and create the `pypi` environment in repo settings.
# Then delete the legacy PYPI_API_TOKEN secret.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check-ci:
    name: require green CI on tagged commit
    runs-on: ubuntu-latest
    steps:
      - name: Assert the tagged commit passed CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The tagged commit must have a successful `pass` check run (from ci.yml).
          conclusion=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs" \
            -q '[.check_runs[] | select(.name == "pass")] | max_by(.completed_at) | .conclusion' || echo "missing")
          echo "CI 'pass' check conclusion for ${GITHUB_SHA}: ${conclusion}"
          if [ "${conclusion}" != "success" ]; then
            echo "::error::Tagged commit has no successful CI 'pass' check. Push the commit to main and let CI finish before tagging."
            exit 1
          fi

  build:
    name: build (sdist + wheel, inspected)
    needs: check-ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0 # hatch-vcs needs tags to derive the version
      - uses: hynek/build-and-inspect-python-package@2abe76da66d0a6a4a227101f9348ee855797cfa5 # v3.0.1

  publish-pypi:
    name: publish to PyPI (trusted publishing + attestations)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/gds_fdtd/
    permissions:
      id-token: write
    steps:
      - name: Download built dists
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Packages
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  github-release:
    name: create signed GitHub release
    # Depends on build only (not publish-pypi): the GitHub release and its
    # Sigstore signatures are produced even while the PyPI trusted publisher
    # is still being set up, and PyPI publication runs in parallel.
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release + upload assets
      id-token: write # Sigstore keyless signing via GitHub OIDC
    steps:
      - name: Download built dists
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Packages
          path: dist
      - name: Sign artifacts with Sigstore (keyless, OIDC)
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: ./dist/*.tar.gz ./dist/*.whl
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false # publishing job: no cache-poisoning surface
      - name: Generate SBOM (CycloneDX, from the released wheel)
        run: |
          python3 -m venv /tmp/sbom-env
          /tmp/sbom-env/bin/pip install --quiet dist/*.whl
          uvx --from cyclonedx-bom cyclonedx-py environment /tmp/sbom-env -o sbom.cdx.json
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          # dists + their .sigstore bundles (Signed-Releases) + SBOM
          files: |
            dist/*
            sbom.cdx.json
          generate_release_notes: true
