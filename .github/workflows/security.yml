name: security

# WP7.2: dependency vulnerability + supply-chain checks.
# CodeQL runs via the repo's default setup (Settings -> Code security).

on:
  pull_request:
  schedule:
    - cron: "23 6 * * 1" # Mondays 06:23 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pip-audit:
    name: pip-audit (known-vulnerability scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"
      - name: Audit locked dependency tree
        # Scoped exceptions, reviewed individually - NOT a blanket mute. Each id
        # is listed with the reason it cannot be remediated downstream; drop the
        # flag as soon as upstream moves. Tracking issue: #115.
        #
        # CVE-2026-69247/69248/69249 (cryptography < 50.0.0 / < 49.0.0):
        #   tidy3d 2.12.0 hard-pins `cryptography==48.0.1` (an exact pin it
        #   applies on Intel macOS), so no resolution of this lock can satisfy
        #   the fixed versions while the tidy3d extra is present - verified with
        #   `uv lock` under a `cryptography>=50` constraint, which reports the
        #   requirements as unsatisfiable.
        #   Not reachable here: the defect is a Bleichenbacher oracle in PKCS#7
        #   EnvelopedData decryption (cryptography...serialization.pkcs7).
        #   Checked rather than assumed - authlib 1.7.2 and tidy3d 2.12.0 each
        #   contain zero references to that API (authlib imports only the
        #   asymmetric/JOSE primitives), and gds_fdtd never imports cryptography.
        run: |
          uv export --locked --all-extras --format requirements-txt --no-emit-project -o requirements-audit.txt
          uvx pip-audit --strict -r requirements-audit.txt \
            --ignore-vuln CVE-2026-69247 \
            --ignore-vuln CVE-2026-69248 \
            --ignore-vuln CVE-2026-69249

  dependency-review:
    name: dependency review (PR diff)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
        with:
          fail-on-severity: high

  zizmor:
    name: zizmor (workflow lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Lint GitHub Actions workflows
        run: uvx zizmor --min-severity medium --no-progress .github/workflows/
