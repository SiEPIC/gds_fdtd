name: security

# WP7.2: dependency vulnerability + supply-chain checks.
# CodeQL runs via the repo's default setup (Settings -> Code security).

on:
  pull_request:
  schedule:
    - cron: "23 6 * * 1" # Mondays 06:23 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pip-audit:
    name: pip-audit (known-vulnerability scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
      - name: Audit locked dependency tree
        # Cryptography exceptions are removed: that extra requires >=50.0.2.
        # Tidy3D 2.11/2.12 still requires filelock<4; fixes require >=4.2.1.
        # Scoped filelock exceptions, reachability and exit criteria:
        # docs/dependency_security.md. Use private, owner-writable cache dirs.
        # All other advisories continue to fail this job.
        run: |
          uv export --locked --all-extras --format requirements-txt --no-emit-project -o requirements-audit.txt
          uvx pip-audit --strict -r requirements-audit.txt \
            --ignore-vuln CVE-2026-112940 \
            --ignore-vuln CVE-2026-112913 \
            --ignore-vuln CVE-2026-112907 \
            --ignore-vuln CVE-2026-112936 \
            --ignore-vuln CVE-2026-112910 \
            --ignore-vuln CVE-2026-112909 \
            --ignore-vuln CVE-2026-112939 \
            --ignore-vuln CVE-2026-112915 \
            --ignore-vuln CVE-2026-112935

  dependency-review:
    name: dependency review (PR diff)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
        with:
          fail-on-severity: high

  zizmor:
    name: zizmor (workflow lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Lint GitHub Actions workflows
        run: uvx zizmor --min-severity medium --no-progress .github/workflows/
